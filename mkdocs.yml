site_name: Flatbread
site_description: Pandas extension for aggregation and tabular display
repo_url: https://github.com/flatbread-dataframes/flatbread

theme:
  name: material
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  custom_dir: docs/overrides
  features:
    - content.code.copy
    - navigation.tabs

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_root_heading: true
            show_source: false
            members_order: source

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: docs

nav:
  - Home: index.md
  - Guide:
    - Getting Started: guide/getting-started.md
    - Aggregation: guide/aggregation.md
    - Panels: guide/panels.md
    - Configuration: guide/configuration.md
    - Formatting: guide/formatting.md
    - Display & Export: guide/display.md
  - API Reference:
    - PitaFrame: api/dataframe.md
    - PitaSeries: api/series.md
    - Display: api/display.md

hooks:
  - docs/hooks/flatbread_table.py
  - docs/hooks/build_examples.py